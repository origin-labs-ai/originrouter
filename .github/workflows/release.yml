name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app deps
        run: npm ci

      - name: Install CLI deps
        run: npm ci
        working-directory: cli

      - name: Build CLI bundle (Next standalone + assets)
        run: npm run build
        working-directory: cli
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package portable folder
        run: node scripts/package-cli.mjs --platform=${{ matrix.platform }}

      - name: Zip portable folder (unix)
        if: matrix.platform != 'win'
        run: cd dist/${{ matrix.platform }} && zip -r ../OriginRouter-${{ matrix.platform }}.zip .

      - name: Zip portable folder (windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: Compress-Archive -Path dist\win\* -DestinationPath dist\OriginRouter-win.zip -Force

      - name: Windows installer (Inno Setup 6)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\originrouter.iss" "/DAppVersion=${{ github.ref_name }}".TrimStart('v')
          Copy-Item dist\installer\*.exe dist\ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: OriginRouter-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
